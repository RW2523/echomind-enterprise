# Unit suites and type-check on every push and pull request (REG-04 NC-2026-010 corrective action).
# Five stale tests and 20 type errors once went unnoticed and a release was tagged with them failing.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install (CPU-only PyTorch)
        run: pip install -r backend/requirements.txt pytest --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Install Tesseract and LibreOffice (EchoMind Law OCR, D-010; Word read-back for T09 and T10)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng libreoffice-writer-nogui
      - name: Test
        working-directory: backend
        run: ECHOMIND_DATA_DIR="$(mktemp -d)" python -m pytest tests -q -rs

  voice:
    name: Voice unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: voice/requirements.txt
      - name: Install
        # webrtcvad imports pkg_resources, which Python 3.12 no longer brings (setuptools 81 removed it); the Law voice
        # socket tests use Starlette's TestClient, which needs httpx.
        run: pip install -r voice/requirements.txt pytest httpx "setuptools<81"
      - name: Test
        working-directory: voice
        run: python -m pytest tests -q -rs

  frontend:
    name: Frontend type-check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit -p .
      - name: Unit tests
        working-directory: frontend
        run: npx vitest run
