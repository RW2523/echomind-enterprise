# One-time online preparation: populates the ollama volume (embed model) and the trtllm HF cache volume (LLM weights).
# Run ONCE before the first docker compose up:
#
#   HF_TOKEN=<your_token> docker compose -f docker-compose.yml -f docker-compose.prepare.yml up ollama trtllm
#
# Wait for both to finish pulling (trtllm can take a while — it downloads ~8 GB).
# Then Ctrl-C or docker compose down. From that point on, docker compose up works fully offline.
services:
  ollama:
    environment:
      - OLLAMA_LLM_MODEL=qwen2.5:7b-instruct-q4_K_M
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - OLLAMA_OFFLINE=0

  trtllm:
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - MODEL_HANDLE=${TRTLLM_MODEL_HANDLE:-nvidia/Llama-3.1-8B-Instruct-FP4}
      # Allow download during prepare run
      - HF_HUB_OFFLINE=0
      - TRTLLM_SKIP_DOWNLOAD=0
