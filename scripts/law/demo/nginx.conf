# EchoMind Legal demo behind a Cloudflare quick tunnel: static app + /api to the local dev backend (fictional data only).
server {
  listen 127.0.0.1:3125;
  client_max_body_size 200m;
  root /usr/share/nginx/html;
  location / {
    try_files $uri $uri/ /index.html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
  }
  location /voice/ { return 404; }
  location /api/ {
    proxy_pass http://127.0.0.1:8110/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The visitor's real address, from Cloudflare (it overwrites this header at its edge); the backend trusts it only from 127.0.0.1.
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600; proxy_send_timeout 3600;
    proxy_buffering off; proxy_cache off; proxy_request_buffering off;
  }
}
