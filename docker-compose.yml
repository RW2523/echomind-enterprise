services:
  backend:
    build:
      context: ./backend
      args:
        USE_FAISS_GPU: "1"   # set to "1" for FAISS GPU (faster RAG search; needs GPU)
        # SKIP_MODEL_DOWNLOAD: "1"  # uncomment if build fails with "file already closed"; model downloads at first Live Transcript use
    container_name: echomind-backend
    expose: ["8000"]
    environment:
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL=qwen2.5:7b-instruct-q4_K_M
      - OLLAMA_EMBED_URL=http://ollama:11434/api/embeddings
      - OLLAMA_EMBED_MODEL=nomic-embed-text
    volumes:
      - echomind_data:/data
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  voice:
    build: ./voice
    volumes:
       - ./voice/voices:/voices
    container_name: echomind-voice
    ports: ["8001:8000"]
    environment:
      - LLM_URL=http://ollama:11434/v1/chat/completions
      - LLM_MODEL=qwen2.5:7b-instruct-q4_K_M
      - WHISPER_MODEL=base
      # RAG: voice bot calls backend for answers from documents + transcripts
      - BACKEND_CHAT_URL=http://backend:8000
    depends_on:
      ollama:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=
    container_name: echomind-frontend
    ports: ["3000:80", "3443:443"]
    depends_on: [backend, voice]

  ollama:
    build:
      context: ./docker/ollama
      dockerfile: Dockerfile
    image: echomind-ollama:setup
    container_name: echomind-ollama
    ports: ["11434:11434"]
    environment:
      - OLLAMA_LLM_MODEL=qwen2.5:7b-instruct-q4_K_M
      - OLLAMA_EMBED_MODEL=nomic-embed-text
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # Pass only when both models are pulled (entrypoint pulls at startup)
      test: ["CMD", "sh", "-c", "ollama list | grep -q qwen2.5:7b-instruct-q4_K_M && ollama list | grep -q nomic-embed-text"]
      interval: 15s
      timeout: 10s
      retries: 80
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  echomind_data:
  ollama_data:
