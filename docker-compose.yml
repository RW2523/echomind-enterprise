services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: echomind-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  rag-platform:
    build:
      context: ./rag-platform
      dockerfile: docker/Dockerfile.arm64.cuda
    container_name: echomind-rag-platform
    expose: ["8000"]
    environment:
      - QDRANT_URL=http://qdrant:6333
      # Use cpu to avoid "no kernel image is available for execution on the device" on some GPUs (e.g. ARM/DGX Spark). Set to cuda if your GPU is supported by the PyTorch cu124 wheel.
      - DEVICE=cpu
      - USE_BF16=1
    volumes:
      - rag_platform_data:/data
    depends_on:
      - qdrant
    healthcheck:
      # Only passes after lifespan completes (embedder + generator loaded); first run can take 10+ min
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  backend:
    build:
      context: ./backend
      args:
        USE_FAISS_GPU: "0"   # set to "1" for FAISS GPU (faster RAG search; needs GPU)
    container_name: echomind-backend
    expose: ["8000"]
    environment:
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL=qwen2.5:7b-instruct
      - OLLAMA_EMBED_URL=http://ollama:11434/api/embeddings
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - RAG_PLATFORM_URL=http://rag-platform:8000
    volumes:
      - echomind_data:/data
    depends_on:
      ollama:
        condition: service_healthy
      rag-platform:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  voice:
    build: ./voice
    volumes:
       - ./voice/voices:/voices
    container_name: echomind-voice
    ports: ["8001:8000"]
    environment:
      - LLM_URL=http://ollama:11434/v1/chat/completions
      - LLM_MODEL=qwen2.5:7b-instruct
      - WHISPER_MODEL=base
      # RAG: voice bot calls backend for answers from documents + transcripts
      - BACKEND_CHAT_URL=http://backend:8000
    depends_on:
      ollama:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=
    container_name: echomind-frontend
    ports: ["3000:80", "3443:443"]
    depends_on: [backend, voice]

  ollama:
    build:
      context: ./docker/ollama
      dockerfile: Dockerfile
    image: echomind-ollama:setup
    container_name: echomind-ollama
    ports: ["11434:11434"]
    environment:
      - OLLAMA_LLM_MODEL=qwen2.5:7b-instruct
      - OLLAMA_EMBED_MODEL=nomic-embed-text
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # Pass only when both models are pulled (entrypoint pulls at startup)
      test: ["CMD", "sh", "-c", "ollama list | grep -q qwen2.5:7b-instruct && ollama list | grep -q nomic-embed-text"]
      interval: 15s
      timeout: 10s
      retries: 80
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  echomind_data:
  ollama_data:
  qdrant_data:
  rag_platform_data:
