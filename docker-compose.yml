services:
  trtllm:
    build:
      context: ./docker/trtllm
    image: echomind-trtllm:1.2.0rc6
    container_name: echomind-trtllm
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "8355:8355"
    environment:
      # Gated HF models: set HF_TOKEN in .env only for the first-time prepare run.
      - HF_TOKEN=${HF_TOKEN:-}
      - MODEL_HANDLE=${TRTLLM_MODEL_HANDLE:-nvidia/Qwen3-30B-A3B-FP4}
      # Memory management: cap KV cache (was 0.9 ~83GB) so the LLM fits beside STT + SDXL on one Spark.
      - TRTLLM_KV_FRACTION=${TRTLLM_KV_FRACTION:-0.5}
      # Offline by default: model weights live in the trtllm_hf_cache volume (populated once via docker-compose.prepare.yml).
      # To re-download, set TRTLLM_HF_HUB_OFFLINE=0 and TRTLLM_SKIP_DOWNLOAD=0 in your .env for one run.
      - HF_HUB_OFFLINE=${TRTLLM_HF_HUB_OFFLINE:-1}
      - TRTLLM_SKIP_DOWNLOAD=${TRTLLM_SKIP_DOWNLOAD:-1}
    volumes:
      - trtllm_hf_cache:/root/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8355/v1/models', timeout=5).read()\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 1200s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        USE_FAISS_GPU: "1"   # set to "1" for FAISS GPU (faster RAG search; needs GPU)
        HF_TOKEN: ${HF_TOKEN:-}
        ECHOMIND_ASR_MODEL_NAME: ${ECHOMIND_ASR_MODEL_NAME:-nvidia/nemotron-speech-streaming-en-0.6b}
        # SKIP_MODEL_DOWNLOAD: "1"  # uncomment if build fails with "file already closed"; incompatible with offline
        # SKIP_NEMOTRON_WARMUP: "1"  # skip NeMo load during build (faster CI; colder first runtime load)
    container_name: echomind-backend
    restart: unless-stopped
    expose: ["8000"]
    healthcheck:
      # 503 when a fatal GPU/CUDA fault poisons the shared context; combined with the in-process
      # watchdog (exits on fatal) + restart policy, the container self-recovers.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 180s
    environment:
      - LLM_BASE_URL=http://trtllm:8355/v1
      - LLM_MODEL=nvidia/Qwen3-30B-A3B-FP4
      - OLLAMA_EMBED_URL=http://ollama:11434/api/embeddings
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      # Offline: use only local Hugging Face cache (no runtime model download)
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      # Document Studio images: real on-device text-to-image (SDXL-Turbo via diffusers).
      # Private + offline after the one-time model download (cached in /data). Set
      # DOCGEN_IMAGE_BACKEND=local for the no-GPU synthetic fallback, or =nim for cloud.
      - DOCGEN_IMAGE_BACKEND=diffusers
      - DOCGEN_DIFFUSERS_MODEL=stabilityai/sdxl-turbo
      - DOCGEN_DIFFUSERS_CACHE=/data/docgen_models
      - DOCGEN_DIFFUSERS_STEPS=4
      - DOCGEN_DIFFUSERS_MAX=1024
      - DOCGEN_MAX_IMAGES=8
      - DOCGEN_IMAGE_CONCURRENCY=1
    volumes:
      - echomind_data:/data
    depends_on:
      trtllm:
        condition: service_healthy
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  voice:
    build:
      context: .
      dockerfile: voice/Dockerfile
      args:
        HF_TOKEN: ${HF_TOKEN:-}
        ECHOMIND_ASR_MODEL_NAME: ${ECHOMIND_ASR_MODEL_NAME:-nvidia/nemotron-speech-streaming-en-0.6b}
        # SKIP_NEMOTRON_WARMUP: "1"  # optional: skip build-time NeMo warmup
    volumes:
       - ./voice/voices:/voices
    container_name: echomind-voice
    restart: unless-stopped
    # Host port for optional direct voice access; Nginx uses voice:8000 on the Docker network (unchanged).
    # Default 8002 — host 8001 is often taken (e.g. uvicorn). Override: VOICE_HOST_PORT=8001 in .env
    ports: ["${VOICE_HOST_PORT:-8002}:8000"]
    healthcheck:
      # /health returns 503 once a fatal CUDA fault poisons STT; with the watchdog (self-exit on
      # fatal) + restart policy, the container recovers automatically with a fresh CUDA context.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 120s
    environment:
      # TensorRT-LLM in compose (OpenAI-compatible); dialogue uses stream=true for TTFT.
      - LLM_URL=http://trtllm:8355/v1/chat/completions
      - LLM_MODEL=nvidia/Qwen3-30B-A3B-FP4
      # Optional: LLM_LOG_PAYLOAD=1 logs full JSON body at WARNING (timing always INFO: VOICE_LLM stream start/done).
      # Nemotron STT (same model as backend live transcript; gated HF — set HF_TOKEN in .env if needed)
      - ECHOMIND_ASR_MODEL_NAME=nvidia/nemotron-speech-streaming-en-0.6b
      # DGX / Spark: keep ASR on GPU (PyTorch). Use ECHOMIND_ASR_DEVICE=cpu only for CPU-only hosts.
      - ECHOMIND_ASR_DEVICE=cuda
      # Fail startup if the voice container cannot see a GPU (no silent CPU fallback for ASR).
      - ECHOMIND_ASR_REQUIRE_CUDA=${ECHOMIND_ASR_REQUIRE_CUDA:-1}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      # Utterance chunking for voice STT (ms); optional override
      - VOICE_NEMOTRON_CHUNK_MS=${VOICE_NEMOTRON_CHUNK_MS:-560}
      # 1 = load Nemotron at startup so GPU/weights issues fail fast on DGX; set 0 for faster WS accept on weak hosts
      - VOICE_NEMOTRON_STARTUP_LOAD=${VOICE_NEMOTRON_STARTUP_LOAD:-1}
      # Piper ONNX TTS on GPU (requires onnxruntime-gpu in the voice image)
      # Piper TTS: onnxruntime CUDA EP isn't available on Spark/ARM (it silently fell back to CPU);
      # set 0 to go straight to CPU. CPU Piper is fast enough for short replies.
      - VOICE_PIPER_USE_CUDA=${VOICE_PIPER_USE_CUDA:-0}
      # Pin voice to one GPU if the host runs trtllm/backend on others, e.g. NVIDIA_VISIBLE_DEVICES=2
      # RAG: voice bot calls backend for answers from documents + transcripts
      - BACKEND_CHAT_URL=http://backend:8000
      # Offline: disable runtime Piper voice download from Hugging Face
      - VOICE_OFFLINE=1
      # ── Voice turn-taking tuning (fixes "cuts off my speech / doesn't listen / cut off for no reason") ──
      # Less-aggressive endpointing so a natural pause doesn't end your turn early.
      - ENDPOINT_SILENCE_MS=${ENDPOINT_SILENCE_MS:-700}
      - ENDPOINT_SILENCE_COMPLETE_MS=${ENDPOINT_SILENCE_COMPLETE_MS:-550}
      - ENDPOINT_SILENCE_INCOMPLETE_MS=${ENDPOINT_SILENCE_INCOMPLETE_MS:-1300}
      # Barge-in balance (~160ms): low enough to interrupt easily, high enough to ignore brief echo/noise.
      - BARGE_IN_SPEECH_LEAD_ACTIVE=${BARGE_IN_SPEECH_LEAD_ACTIVE:-8}
      # More permissive VAD so quieter speech isn't dropped.
      - VAD_AGGR=${VAD_AGGR:-1}
      # Local voice replies were capped at 220 tokens (~150 words) and truncated mid-sentence; raise the ceiling.
      - LLM_MAX_TOKENS=${VOICE_LLM_MAX_TOKENS:-420}
      # Accurate FINAL transcript (the text that feeds the LLM) via NeMo Parakeet-TDT; fixes domain-term
      # mishearing ("DoD FMR"->"DODFMA"). Live partials stay on the streaming model. Falls back on error.
      - VOICE_USE_PARAKEET=${VOICE_USE_PARAKEET:-1}
      - VOICE_FINAL_ASR_MODEL=${VOICE_FINAL_ASR_MODEL:-nvidia/parakeet-tdt-0.6b-v2}
      # Parakeet on CPU (Grace) — avoids the CUDA-graph illegal-memory-access seen when it ran
      # on the GPU alongside trtllm. Set to cuda only if a future stack proves stable.
      - VOICE_PARAKEET_DEVICE=${VOICE_PARAKEET_DEVICE:-cpu}
    depends_on:
      trtllm:
        condition: service_healthy
      ollama:
        condition: service_healthy
      backend:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=
    container_name: echomind-frontend
    ports: ["3000:80", "3443:443"]
    depends_on: [backend, voice]

  # ── Public access via Cloudflare Tunnel (OPT-IN: only starts with `--profile public`) ──
  # Domain: echomind-ajace.com. Create a *remote-managed* tunnel in the Cloudflare
  # Zero Trust dashboard, put its token in .env as TUNNEL_TOKEN, then route the public
  # hostname echomind-ajace.com -> http://frontend:80 (cloudflared shares this network).
  # ⚠️ GATE IT WITH CLOUDFLARE ACCESS (login) FIRST — EchoMind has no built-in auth.
  # Full runbook: docs/PUBLIC_DEPLOYMENT.md   Start: docker compose --profile public up -d cloudflared
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: echomind-cloudflared
    restart: unless-stopped
    profiles: ["public"]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    depends_on: [frontend]

  ollama:
    build:
      context: ./docker/ollama
      dockerfile: Dockerfile
    image: echomind-ollama:setup
    container_name: echomind-ollama
    ports: ["11434:11434"]
    environment:
      - OLLAMA_LLM_MODEL=qwen2.5:7b-instruct-q4_K_M
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      # Chat LLM is TensorRT-LLM; Ollama only serves embeddings for RAG
      - OLLAMA_EMBED_ONLY=1
      # Offline: do not pull at startup; require models in volume (populated by prepare step)
      - OLLAMA_OFFLINE=1
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # Embed model only (see OLLAMA_EMBED_ONLY)
      test: ["CMD", "sh", "-c", "ollama list | grep -q nomic-embed-text"]
      interval: 15s
      timeout: 10s
      retries: 80
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  echomind_data:
  ollama_data:
  trtllm_hf_cache:
