services:
  trtllm:
    build:
      context: ./docker/trtllm
    image: echomind-trtllm:1.2.0rc6
    container_name: echomind-trtllm
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "8355:8355"
    environment:
      # Gated HF models: set HF_TOKEN in .env only for the first-time prepare run.
      - HF_TOKEN=${HF_TOKEN:-}
      - MODEL_HANDLE=${TRTLLM_MODEL_HANDLE:-nvidia/Llama-3.1-8B-Instruct-FP4}
      # Offline by default: model weights live in the trtllm_hf_cache volume (populated once via docker-compose.prepare.yml).
      # To re-download, set TRTLLM_HF_HUB_OFFLINE=0 and TRTLLM_SKIP_DOWNLOAD=0 in your .env for one run.
      - HF_HUB_OFFLINE=${TRTLLM_HF_HUB_OFFLINE:-1}
      - TRTLLM_SKIP_DOWNLOAD=${TRTLLM_SKIP_DOWNLOAD:-1}
    volumes:
      - trtllm_hf_cache:/root/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8355/v1/models', timeout=5).read()\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 1200s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        USE_FAISS_GPU: "1"   # set to "1" for FAISS GPU (faster RAG search; needs GPU)
        HF_TOKEN: ${HF_TOKEN:-}
        ECHOMIND_ASR_MODEL_NAME: ${ECHOMIND_ASR_MODEL_NAME:-nvidia/nemotron-speech-streaming-en-0.6b}
        # SKIP_MODEL_DOWNLOAD: "1"  # uncomment if build fails with "file already closed"; incompatible with offline
        # SKIP_NEMOTRON_WARMUP: "1"  # skip NeMo load during build (faster CI; colder first runtime load)
    container_name: echomind-backend
    expose: ["8000"]
    environment:
      - LLM_BASE_URL=http://trtllm:8355/v1
      - LLM_MODEL=nvidia/Llama-3.1-8B-Instruct-FP4
      - OLLAMA_EMBED_URL=http://ollama:11434/api/embeddings
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      # Offline: use only local Hugging Face cache (no runtime model download)
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      # Nemotron live STT (Transcribe / Assistant / Silent): default CPU avoids CUDA contention with
      # trtllm + voice on one GPU (otherwise pcm consumer logs cudaErrorNotPermitted / unknown and no text).
      # Override in .env: ECHOMIND_BACKEND_ASR_DEVICE=cuda when backend has its own GPU or MIG slice.
      - ECHOMIND_ASR_DEVICE=${ECHOMIND_BACKEND_ASR_DEVICE:-cpu}
    volumes:
      - echomind_data:/data
    depends_on:
      trtllm:
        condition: service_healthy
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  voice:
    build:
      context: .
      dockerfile: voice/Dockerfile
      args:
        HF_TOKEN: ${HF_TOKEN:-}
        ECHOMIND_ASR_MODEL_NAME: ${ECHOMIND_ASR_MODEL_NAME:-nvidia/nemotron-speech-streaming-en-0.6b}
        # SKIP_NEMOTRON_WARMUP: "1"  # optional: skip build-time NeMo warmup
    volumes:
       - ./voice/voices:/voices
    container_name: echomind-voice
    # Host port for optional direct voice access; Nginx uses voice:8000 on the Docker network (unchanged).
    # Default 8002 — host 8001 is often taken (e.g. uvicorn). Override: VOICE_HOST_PORT=8001 in .env
    ports: ["${VOICE_HOST_PORT:-8002}:8000"]
    environment:
      # TensorRT-LLM in compose (OpenAI-compatible); dialogue uses stream=true for TTFT.
      - LLM_URL=http://trtllm:8355/v1/chat/completions
      - LLM_MODEL=nvidia/Llama-3.1-8B-Instruct-FP4
      # Optional: LLM_LOG_PAYLOAD=1 logs full JSON body at WARNING (timing always INFO: VOICE_LLM stream start/done).
      # Nemotron STT (same model as backend live transcript; gated HF — set HF_TOKEN in .env if needed)
      - ECHOMIND_ASR_MODEL_NAME=nvidia/nemotron-speech-streaming-en-0.6b
      # Default CPU: same single-GPU contention that breaks backend CUDA Nemotron also breaks voice STT
      # when TensorRT-LLM is loaded (cudaErrorNotPermitted / unknown). Override: ECHOMIND_VOICE_ASR_DEVICE=cuda
      # when this container has a dedicated GPU slice.
      - ECHOMIND_ASR_DEVICE=${ECHOMIND_VOICE_ASR_DEVICE:-cpu}
      # With CPU STT, do not require CUDA for Nemotron load (Piper TTS may still use GPU via VOICE_PIPER_USE_CUDA).
      - ECHOMIND_ASR_REQUIRE_CUDA=${ECHOMIND_VOICE_ASR_REQUIRE_CUDA:-0}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      # Utterance chunking for voice STT (ms); optional override
      - VOICE_NEMOTRON_CHUNK_MS=${VOICE_NEMOTRON_CHUNK_MS:-560}
      # 1 = load Nemotron at startup so GPU/weights issues fail fast on DGX; set 0 for faster WS accept on weak hosts
      - VOICE_NEMOTRON_STARTUP_LOAD=${VOICE_NEMOTRON_STARTUP_LOAD:-1}
      # Piper ONNX TTS on GPU (requires onnxruntime-gpu in the voice image)
      - VOICE_PIPER_USE_CUDA=${VOICE_PIPER_USE_CUDA:-1}
      # Pin voice to one GPU if the host runs trtllm/backend on others, e.g. NVIDIA_VISIBLE_DEVICES=2
      # RAG: voice bot calls backend for answers from documents + transcripts
      - BACKEND_CHAT_URL=http://backend:8000
      # Offline: disable runtime Piper voice download from Hugging Face
      - VOICE_OFFLINE=1
    depends_on:
      trtllm:
        condition: service_healthy
      ollama:
        condition: service_healthy
      backend:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=
    container_name: echomind-frontend
    ports: ["3000:80", "3443:443"]
    depends_on: [backend, voice]

  ollama:
    build:
      context: ./docker/ollama
      dockerfile: Dockerfile
    image: echomind-ollama:setup
    container_name: echomind-ollama
    ports: ["11434:11434"]
    environment:
      - OLLAMA_LLM_MODEL=qwen2.5:7b-instruct-q4_K_M
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      # Chat LLM is TensorRT-LLM; Ollama only serves embeddings for RAG
      - OLLAMA_EMBED_ONLY=1
      # Offline: do not pull at startup; require models in volume (populated by prepare step)
      - OLLAMA_OFFLINE=1
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # Embed model only (see OLLAMA_EMBED_ONLY)
      test: ["CMD", "sh", "-c", "ollama list | grep -q nomic-embed-text"]
      interval: 15s
      timeout: 10s
      retries: 80
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  echomind_data:
  ollama_data:
  trtllm_hf_cache:
