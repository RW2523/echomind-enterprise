services:
  backend:
    build:
      context: ./backend
      args:
        USE_FAISS_GPU: "0"   # "0" frees GPU for SGLang on single-GPU; "1" for FAISS GPU if enough VRAM
        # SKIP_MODEL_DOWNLOAD: "1"  # uncomment if build fails with "file already closed"
    container_name: echomind-backend
    expose: ["8000"]
    environment:
      - LLM_BASE_URL=http://sglang-llm:30000/v1
      - LLM_MODEL=nvidia/Llama-3.1-8B-Instruct-FP8
      - EMBED_URL=http://ollama-embed:11434/api/embeddings
      - EMBED_MODEL=nomic-embed-text
      - EMBED_FORMAT=ollama
    volumes:
      - echomind_data:/data
    depends_on:
      sglang-llm:
        condition: service_healthy
      ollama-embed:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  voice:
    build: ./voice
    volumes:
       - ./voice/voices:/voices
    container_name: echomind-voice
    ports: ["8001:8000"]
    environment:
      - LLM_URL=http://sglang-llm:30000/v1/chat/completions
      - LLM_MODEL=nvidia/Llama-3.1-8B-Instruct-FP8
      - WHISPER_MODEL=base
      - BACKEND_CHAT_URL=http://backend:8000
    depends_on:
      sglang-llm:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=
    container_name: echomind-frontend
    ports: ["3000:80", "3443:443"]
    depends_on: [backend, voice]

  sglang-llm:
    image: lmsysorg/sglang:spark
    container_name: echomind-sglang-llm
    ports: ["30000:30000"]
    shm_size: "32gb"
    ipc: host
    environment:
      - SGLANG_LLM_MODEL=nvidia/Llama-3.1-8B-Instruct-FP8
      - SGLANG_LLM_PORT=30000
      - SGLANG_GB10_MEM_MB=100000
    volumes:
      - sglang_data:/root/.cache/huggingface
      - ./docker/sglang/launch_gb10.py:/tmp/launch_gb10.py
    command: ["/bin/bash", "-c", "python3 /tmp/launch_gb10.py --model-path ${SGLANG_LLM_MODEL:-nvidia/Llama-3.1-8B-Instruct-FP8} --host 0.0.0.0 --port 30000 --tp 1 --attention-backend flashinfer --mem-fraction-static 0.75 --trust-remote-code --log-level info"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:30000/health')"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-embed:
    build:
      context: ./docker/ollama-embed
      dockerfile: Dockerfile
    container_name: echomind-ollama-embed
    ports: ["11435:11434"]
    environment:
      - OLLAMA_EMBED_MODEL=nomic-embed-text
    volumes:
      - ollama_embed_data:/root/.ollama
    healthcheck:
      test: ["CMD", "sh", "-c", "ollama list 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

volumes:
  echomind_data:
  sglang_data:
  ollama_embed_data:
