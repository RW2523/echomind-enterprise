services:
  trtllm:
    build:
      context: ./docker/trtllm
    image: echomind-trtllm:1.2.0rc6
    container_name: echomind-trtllm
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "8355:8355"
    environment:
      # Gated HF models: set HF_TOKEN in .env or the shell before compose up
      - HF_TOKEN=${HF_TOKEN:-}
      - MODEL_HANDLE=${TRTLLM_MODEL_HANDLE:-nvidia/Llama-3.1-8B-Instruct-FP4}
      # First start downloads weights into the volume; later starts reuse cache (set TRTLLM_SKIP_DOWNLOAD=1 + HF_HUB_OFFLINE=1 only after cache is full)
      - HF_HUB_OFFLINE=${TRTLLM_HF_HUB_OFFLINE:-0}
      - TRTLLM_SKIP_DOWNLOAD=${TRTLLM_SKIP_DOWNLOAD:-0}
    volumes:
      - trtllm_hf_cache:/root/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8355/v1/models', timeout=5).read()\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 1200s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build:
      context: ./backend
      args:
        USE_FAISS_GPU: "1"   # set to "1" for FAISS GPU (faster RAG search; needs GPU)
        # SKIP_MODEL_DOWNLOAD: "1"  # uncomment if build fails with "file already closed"; incompatible with offline
    container_name: echomind-backend
    expose: ["8000"]
    environment:
      - LLM_BASE_URL=http://trtllm:8355/v1
      - LLM_MODEL=nvidia/Llama-3.1-8B-Instruct-FP4
      - OLLAMA_EMBED_URL=http://ollama:11434/api/embeddings
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      # Offline: use only local Hugging Face cache (no runtime model download)
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - echomind_data:/data
    depends_on:
      trtllm:
        condition: service_healthy
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  voice:
    build: ./voice
    volumes:
       - ./voice/voices:/voices
    container_name: echomind-voice
    ports: ["8001:8000"]
    environment:
      # TensorRT-LLM in compose (OpenAI-compatible); dialogue uses stream=true for TTFT.
      - LLM_URL=http://trtllm:8355/v1/chat/completions
      - LLM_MODEL=nvidia/Llama-3.1-8B-Instruct-FP4
      # Optional: LLM_LOG_PAYLOAD=1 logs full JSON body at WARNING (timing always INFO: VOICE_LLM stream start/done).
      - WHISPER_MODEL=base
      # RAG: voice bot calls backend for answers from documents + transcripts
      - BACKEND_CHAT_URL=http://backend:8000
      # Offline: disable runtime Piper voice download from Hugging Face
      - VOICE_OFFLINE=1
    depends_on:
      trtllm:
        condition: service_healthy
      ollama:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=
    container_name: echomind-frontend
    ports: ["3000:80", "3443:443"]
    depends_on: [backend, voice]

  ollama:
    build:
      context: ./docker/ollama
      dockerfile: Dockerfile
    image: echomind-ollama:setup
    container_name: echomind-ollama
    ports: ["11434:11434"]
    environment:
      - OLLAMA_LLM_MODEL=qwen2.5:7b-instruct-q4_K_M
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      # Chat LLM is TensorRT-LLM; Ollama only serves embeddings for RAG
      - OLLAMA_EMBED_ONLY=1
      # Offline: do not pull at startup; require models in volume (populated by prepare step)
      - OLLAMA_OFFLINE=1
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # Embed model only (see OLLAMA_EMBED_ONLY)
      test: ["CMD", "sh", "-c", "ollama list | grep -q nomic-embed-text"]
      interval: 15s
      timeout: 10s
      retries: 80
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  echomind_data:
  ollama_data:
  trtllm_hf_cache:
