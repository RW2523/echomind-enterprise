# EchoMind Law — isolated stack override (decision D-002, docs/echomind-law/DECISIONS.md).
#
# ALWAYS use it together with its own project name, e.g.:
#   scripts/law/compose.sh config           # render and check, starts nothing
#   scripts/law/compose.sh up -d backend voice frontend
# which runs: docker compose -p echomind-law -f docker-compose.yml -f docker-compose.law.yml --env-file .env.law …
#
# Why: this repository's folder is named like the production checkout on the same DGX Spark, so a
# plain `docker compose up` here would reuse production's project name, containers and data volume.
# This override gives every service its own container name, ports and volume, never starts a
# second LLM / embedding server (it reuses the host-published ones read-only), never starts the
# public Cloudflare tunnel, keeps the backend and voice off the GPU by default, and runs Law images
# built on the 1.4.1 images with one commit's code baked in (scripts/law/build_images.sh, D-060; no
# 30+ GB rebuild). Each container is capped and is the kernel's first choice under memory pressure,
# so the Law stack cannot crowd out production.

x-law-capped: &law_capped
  pull_policy: never
  oom_score_adj: 800              # killed before production's processes if the host runs out of memory

x-law-host-gateway: &law_host_gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  # ── Shared with production: never started by this project ─────────────────────────────────
  trtllm:
    profiles: ["never"]
    container_name: echomind-law-trtllm-disabled
    ports: !reset []
  ollama:
    profiles: ["never"]
    container_name: echomind-law-ollama-disabled
    ports: !reset []
  cloudflared:
    profiles: ["never"]          # no public ingress for the Law edition (THREAT_MODEL T-17)
    container_name: echomind-law-cloudflared-disabled

  backend:
    <<: [*law_host_gateway, *law_capped]
    build: !reset null            # a merged key cannot reset, so each service resets its own
    image: ${LAW_BACKEND_IMAGE:-echomind-law-backend:latest}
    mem_limit: ${LAW_BACKEND_MEM:-8g}
    memswap_limit: ${LAW_BACKEND_MEM:-8g}
    container_name: echomind-law-backend
    depends_on: !reset {}
    volumes: !override
      - echomind_law_data:/data
      # D-014: the master key stays outside the data volume (chmod 600 on the host).
      - ${LAW_MASTER_KEY_FILE:?set LAW_MASTER_KEY_FILE in .env.law (see .env.law.example)}:/run/secrets/law_master_key:ro
    environment:
      - ECHOMIND_EDITION=law
      - LEGAL_MASTER_KEY_FILE=/run/secrets/law_master_key
      - AUTH_ENABLED=1
      - AUTH_SECRET=${LAW_AUTH_SECRET:?set LAW_AUTH_SECRET in .env.law (openssl rand -hex 32)}
      - AUTH_ADMIN_USER=${LAW_ADMIN_USER:-admin}
      - AUTH_ADMIN_PASSWORD=${LAW_ADMIN_PASSWORD:?set LAW_ADMIN_PASSWORD in .env.law}
      - CORS_ALLOW_ORIGINS=${LAW_CORS_ORIGINS:-https://localhost:3553,http://localhost:3110}
      - LLM_BASE_URL=http://host.docker.internal:${LAW_LLM_HOST_PORT:-8355}/v1
      - OLLAMA_EMBED_URL=http://host.docker.internal:${LAW_OLLAMA_HOST_PORT:-11435}/api/embeddings
      - VOICE_TTS_URL=http://voice:8000/speak
      - DOCGEN_IMAGE_BACKEND=none
      - ECHOMIND_ASR_DEVICE=${LAW_ASR_DEVICE:-cpu}
      - CUDA_VISIBLE_DEVICES=${LAW_BACKEND_CUDA_VISIBLE_DEVICES-}
      - ECHOMIND_EXIT_ON_FATAL_CUDA=0
      # Speech recognition loads on the first live transcript, not at every start: on CPU it needs a few GB
      # of the memory this host shares with production (D-060).
      - ECHOMIND_ASR_PRELOAD=${LAW_ASR_PRELOAD:-0}
      # Phase 4 features (D-058, D-059): off unless .env.law turns them on.
      - LEGAL_INTAKE=${LAW_INTAKE:-0}
      - LEGAL_INTAKE_LINKS=${LAW_INTAKE_LINKS:-0}
      - LEGAL_INTAKE_LINK_DAYS=${LAW_INTAKE_LINK_DAYS:-14}
      - LEGAL_SUMMARIES=${LAW_SUMMARIES:-0}
      - LEGAL_TIME_ENTRIES=${LAW_TIME_ENTRIES:-0}
      - LEGAL_PANEL=${LAW_PANEL:-0}
      # S5.1 (D-062): the conversation assistant.
      - LEGAL_CONVERSATION=${LAW_CONVERSATION:-0}

  voice:
    <<: [*law_host_gateway, *law_capped]
    build: !reset null
    image: ${LAW_VOICE_IMAGE:-echomind-law-voice:latest}
    mem_limit: ${LAW_VOICE_MEM:-3g}
    memswap_limit: ${LAW_VOICE_MEM:-3g}
    container_name: echomind-law-voice
    ports: !reset []             # reached only through the Law frontend's /voice/ proxy
    depends_on: !override
      backend:
        condition: service_started
    volumes: !override
      - ./voice/voices:/voices:ro
    environment:
      - ECHOMIND_EDITION=law
      - VOICE_AUTH_ENABLED=1
      # The voice service validates browser sessions through the backend and uses on-behalf-of
      # tokens (D-013); it does not need the backend's signing secret, so it is not given it.
      - VOICE_AUTH_SECRET=
      - VOICE_ALLOWED_ORIGINS=${LAW_CORS_ORIGINS:-https://localhost:3553,http://localhost:3110}
      - VOICE_OFFLINE=1
      - LLM_URL=http://host.docker.internal:${LAW_LLM_HOST_PORT:-8355}/v1/chat/completions
      - BACKEND_CHAT_URL=http://backend:8000
      - ECHOMIND_ASR_DEVICE=${LAW_ASR_DEVICE:-cpu}
      - ECHOMIND_ASR_REQUIRE_CUDA=0
      - VOICE_PARAKEET_DEVICE=${LAW_ASR_DEVICE:-cpu}
      - CUDA_VISIBLE_DEVICES=${LAW_VOICE_CUDA_VISIBLE_DEVICES-}
      - VOICE_NEMOTRON_STARTUP_LOAD=${LAW_VOICE_STARTUP_LOAD:-0}
      # The base stack preloads Parakeet for final decodes; on CPU that alone exceeds the cap (D-060).
      - VOICE_USE_PARAKEET=${LAW_VOICE_USE_PARAKEET:-0}

  frontend:
    <<: *law_capped
    build: !reset null
    image: ${LAW_FRONTEND_IMAGE:-echomind-law-frontend:latest}
    mem_limit: ${LAW_FRONTEND_MEM:-256m}
    memswap_limit: ${LAW_FRONTEND_MEM:-256m}
    container_name: echomind-law-frontend
    ports: !override
      - "${LAW_HTTP_PORT:-3110}:80"
      - "${LAW_HTTPS_PORT:-3553}:443"

volumes:
  echomind_law_data: {}
