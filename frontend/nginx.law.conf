# S4.1 (D-054): an enquirer's intake link (/intake/<token>, /api/intake-link/<token>) and a sign-in enrolment link
# (?enrol=<token>) are credentials. The access log writes the address with the token masked, and leaves out the
# referrer, which can carry the link page's address.
map $request_uri $echomind_logged_uri {
  "~^(?<lp>/intake/|/api/intake-link/)[^/?]+(?<lr>.*)$"        "${lp}<secret>${lr}";
  "~^(?<sp>/signin\?(?:.*&)?enrol=)[^&]+(?<sr>.*)$"            "${sp}<secret>${sr}";
  default                                                      $request_uri;
}
log_format echomind_masked '$remote_addr - $remote_user [$time_local] "$request_method $echomind_logged_uri $server_protocol" '
                           '$status $body_bytes_sent "$http_user_agent"';

# HTTP (optional; redirect to HTTPS if you want HTTPS-only)
server {
  listen 80;
  server_name echomind-ajace.com _;
  client_max_body_size 200m;
  access_log /var/log/nginx/access.log echomind_masked;

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    # EchoMind Legal (docs/echomind-legal/08): the app loads only from this server; no CDN, fonts, frames or plugins.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /intake/ {
    root /usr/share/nginx/html;
    try_files /index.html =404;
    # EchoMind Legal (docs/echomind-legal/08): the app loads only from this server; no CDN, fonts, frames or plugins.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
  }

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    # Stream NDJSON (e.g. /chat/ask-stream) to the browser immediately — default buffering hides tokens until ~8KB.
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
  }

  location /voice/ {
    # EchoMind Law (D-062): the voice service's own HTTP routes answer without a session, and the Law
    # interface never calls them; speech goes through the signed-in backend. Refused here.
    return 404;
  }
}

# HTTPS (no domain: self-signed cert; accept browser warning)
server {
  listen 443 ssl;
  server_name echomind-ajace.com _;
  client_max_body_size 200m;
  access_log /var/log/nginx/access.log echomind_masked;

  ssl_certificate     /etc/nginx/ssl/cert.pem;
  ssl_certificate_key /etc/nginx/ssl/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  # EchoMind Legal (review F7): browsers keep to HTTPS once the firm's certificate is trusted (ignored for a self-signed one).
  add_header Strict-Transport-Security "max-age=31536000" always;

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    # EchoMind Legal (docs/echomind-legal/08): the app loads only from this server; no CDN, fonts, frames or plugins.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  location /intake/ {
    root /usr/share/nginx/html;
    try_files /index.html =404;
    # EchoMind Legal (docs/echomind-legal/08): the app loads only from this server; no CDN, fonts, frames or plugins.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
  }

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
  }

  location /voice/ {
    # EchoMind Law (D-062): the voice service's own HTTP routes answer without a session, and the Law
    # interface never calls them; speech goes through the signed-in backend. Refused here.
    return 404;
  }
}
